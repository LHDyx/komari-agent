name: Custom Cross Build

# 个人 fork 用的交叉编译工作流：覆盖与官方 build_all.sh 完全一致的全部平台组合，
# 产物上传为 Artifact，并发布为预发布 Release。
#
# 版本号约定（见 CUSTOM-BUILD.md）：
#   内嵌版本    = <最近正式 tag +1 patch>+custom.<yymmddhhMM>.<sha>      例如 1.5.12+custom.2611160949.d4f4eda
#   Release tag = <最近正式 tag +2 patch>-custom.<yymmddhhMM>            例如 1.5.13-custom.2611160949
# 两者都是合法 semver；Release tag 在该 minor 线内按时间递增，可作为自更新源：
#   komari-agent --update-repo LHDyx/komari-agent   （并去掉 --disable-auto-update）
# 本工作流不做官方 snapshot 那样的 "必须等于上游 main" 校验，fork 的改动可以直接构建。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '内嵌版本号（留空自动生成 <最近正式tag+1patch>+custom.<时间>.<sha>）'
        required: false
        type: string
      publish:
        description: '是否发布 Release（关闭则只上传 Artifact）'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/README.md'
      - '**.md'

permissions:
  contents: write

concurrency:
  group: custom-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      reltag: ${{ steps.version.outputs.reltag }}
      stamp: ${{ steps.version.outputs.stamp }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 时间戳 yymmddhhMM（UTC）。Release tag 按它递增，保证每次构建都比上一次大。
          TS="$(date -u +%y%m%d%H%M)"
          SHA="$(git rev-parse --short HEAD)"
          # 只认形如 x.y.z 的正式 tag（--match 同时能排除带 -/+ 的 tag，比多个 --exclude 更可靠；
          # 注意 --exclude='*-custom.*' 这类模式实际匹配不上 prerelease 段里的点分隔）。
          CURRENT_LINE="$(git describe --tags --abbrev=0 --match='[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          if ! printf '%s\n' "${CURRENT_LINE}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "WARNING: 未找到形如 x.y.z 的正式 tag（got '${CURRENT_LINE}'），回退到 0.0.0" >&2
            CURRENT_LINE="0.0.0"
          fi
          # 基础版本 = 最近正式 tag +1 个 patch（1.5.11 -> 1.5.12），内嵌版本用它。
          # 保持同一 minor 线：更新器只在当前 major.minor 内查找候选（targetCurrentLine）。
          # 注意 blang/semver 的怪癖：`1.5.12-custom.123` 这类 alpha+数字的预发布
          # 会被判定为 *小于* `1.5.12`，因此 Release tag 必须再抬一个 patch（见下）。
          MAJOR="${CURRENT_LINE%%.*}"
          REST="${CURRENT_LINE#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST##*.}"
          BASE="${MAJOR}.${MINOR}.$((PATCH + 1))"

          # 二进制内嵌版本 = 官方基础版本 + build 元数据（1.5.12+custom.2611160949.d4f4eda）。
          # 与原版只有 build 元数据之分，面板上能一眼看出是自构建。
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${BASE}+custom.${TS}.${SHA}"
          fi

          # Release tag = 基础版本再 +1 个 patch + 预发布标识（1.5.12 -> 1.5.13-custom.2611160949）。
          # 更新器只认 semver：1.5.13-custom.* 严格大于内嵌的 1.5.12+custom.*，且按时间递增，
          # 因此 agent 会看到"有更新"并升级到最新一次自构建。
          RELTAG="${MAJOR}.${MINOR}.$((PATCH + 2))-custom.${TS}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "reltag=${RELTAG}" >> "$GITHUB_OUTPUT"
          echo "stamp=${TS}-${SHA}" >> "$GITHUB_OUTPUT"
          echo "Embedded version: ${VERSION}"
          echo "Release tag:      ${RELTAG}"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 build_all.sh / release.yml 保持一致
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          BINARY_NAME="komari-agent-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -trimpath \
            -ldflags="-s -w -X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION}" \
            -o "${BINARY_NAME}"
          sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [prepare, build]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELTAG: ${{ needs.prepare.outputs.reltag }}
          STAMP: ${{ needs.prepare.outputs.stamp }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -alR artifacts
          NOTES="Custom build of Komari Agent.

          - Embedded version: \`${VERSION}\`
          - Release tag: \`${RELTAG}\`
          - Source: ${REPO}@${GITHUB_SHA}
          - Actions run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}

          Personal build, not an official Komari Agent release. Assets follow the official naming
          (\`komari-agent-<os>-<arch>\`), so it can be used as an auto-update source via
          \`--update-repo ${REPO}\`."

          # 清理历史遗留的固定 tag 版 Release（早期方案用的 tag "custom"）。
          if gh release view custom --repo "${REPO}" >/dev/null 2>&1; then
            echo "Deleting legacy release 'custom'..."
            gh release delete custom --repo "${REPO}" --cleanup-tag --yes || true
          fi

          # 保留最近若干次自构建 Release，供作为更新源时按 semver 递增选择；其余清理。
          KEEP=10
          mapfile -t OLD < <(gh release list --repo "${REPO}" --limit 100 \
            --json tagName --jq '.[].tagName' | grep -E -- '-custom\.[0-9]{10,}$' | sort -r | tail -n +$((KEEP + 1)) || true)
          for tag in "${OLD[@]:-}"; do
            [ -n "${tag}" ] || continue
            echo "Deleting old custom release ${tag}..."
            gh release delete "${tag}" --repo "${REPO}" --cleanup-tag --yes || true
          done

          # prerelease=true：agent 的稳定通道会跳过预发布，只有在显式指定该版本时才可取用；
          # 版本号仍可正常解析比较（1.5.11-custom.* > 1.5.11）。
          gh release create "${RELTAG}" \
            --repo "${REPO}" \
            --target "${GITHUB_SHA}" \
            --title "Custom Build (${VERSION})" \
            --notes "${NOTES}" \
            --prerelease \
            --latest=false \
            artifacts/komari-agent-*
