name: Custom Cross Build

# 个人 fork 用的交叉编译工作流：覆盖与官方 build_all.sh 完全一致的全部平台组合，
# 产物上传为 Artifact，并按类型发布 Release。
#
# 版本号约定（见 CUSTOM-BUILD.md），基础版本与官方同步、不领先，内嵌版本与 tag 完全相同：
#   预览版（人工替换）  <基础版本>-custom-pre.<i>   例如 1.5.11-custom-pre.1
#   正式版（自动更新）  <基础版本>-custom.<i>       例如 1.5.11-custom.1
# 两支 i 各自独立递增，官方换代（基础版本变化）后重置。
# 自动通道（isCustomReleaseVersion）只接受 -custom.<i>，预览版不会进入自动更新。
# 本工作流不做官方 snapshot 那样的 "必须等于上游 main" 校验，fork 的改动可以直接构建。

on:
  workflow_dispatch:
    inputs:
      kind:
        description: '构建类型：preview（预览，人工替换）/ release（正式，自动更新）'
        required: false
        type: choice
        options:
          - preview
          - release
        default: preview
      publish:
        description: '是否发布 Release（关闭则只上传 Artifact）'
        required: false
        type: boolean
        default: true
  # 只手动触发：避免每次推送都构建并产生预览版。
  # 日常改动请在本地用 ./build-local.sh 编译验证。

permissions:
  contents: write

concurrency:
  group: custom-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      reltag: ${{ steps.version.outputs.reltag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_KIND: ${{ inputs.kind || 'preview' }}
        run: |
          set -euo pipefail
          # 基础版本 = 最近正式 tag（与官方同步，不领先）。
          # 不用 git describe --match：其通配符是 fnmatch（无 FNM_PATHNAME），'*' 能跨过 '.'。
          BASE="$(git tag --merged HEAD --sort=-v:refname | grep -Ex '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
          if [ -z "${BASE}" ]; then
            echo "WARNING: 未找到形如 x.y.z 的正式 tag，回退到 0.0.0" >&2
            BASE="0.0.0"
          fi

          # 序号 i 从现有 tag 推断，两支各自独立递增，且只统计当前基础版本。
          # 只接受 1-8 位数字，旧的 <base>-custom.<10位时间戳> 格式不参与计数（它们会被发布步骤删除）：
          #   预览 <BASE>-custom-pre.<i>   正式 <BASE>-custom.<i>
          # 官方换代（BASE 变化）后自动从头开始，例如 1.5.12-custom-pre.1。
          case "${INPUT_KIND}" in
            release)
              PREFIX="${BASE}-custom"
              LAST="$(git tag -l "${BASE}-custom.[0-9]*" | sed -nE "s/^${BASE}-custom\\.([0-9]{1,8})$/\\1/p" | sort -n | tail -n 1 || true)"
              ;;
            *)
              PREFIX="${BASE}-custom-pre"
              LAST="$(git tag -l "${BASE}-custom-pre.[0-9]*" | sed -nE "s/^${BASE}-custom-pre\\.([0-9]{1,8})$/\\1/p" | sort -n | tail -n 1 || true)"
              ;;
          esac
          NEXT=$(( ${LAST:-0} + 1 ))

          # 二进制内嵌版本与 tag 完全一致：相等不会被判为"有更新"，不会重复安装。
          VERSION="${PREFIX}.${NEXT}"
          if [ "${INPUT_KIND}" = "release" ]; then
            PRE=false
          else
            PRE=true
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "reltag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRE}" >> "$GITHUB_OUTPUT"
          echo "Embedded version: ${VERSION}"
          echo "Release tag:      ${VERSION} (prerelease=${PRE})"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 build_all.sh / release.yml 保持一致
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          BINARY_NAME="komari-agent-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -trimpath \
            -ldflags="-s -w -X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION}" \
            -o "${BINARY_NAME}"
          sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [prepare, build]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELTAG: ${{ needs.prepare.outputs.reltag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -alR artifacts
          KIND_TEXT=preview; [ "${PRERELEASE}" = "true" ] || KIND_TEXT=release
          NOTES="Custom build of Komari Agent (${KIND_TEXT}).

          - Embedded version: \`${VERSION}\`
          - Release tag: \`${RELTAG}\`
          - Source: ${REPO}@${GITHUB_SHA}
          - Actions run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}

          Personal build, not an official Komari Agent release. Assets follow the official naming
          (\`komari-agent-<os>-<arch>\`), so it can be used as an auto-update source via
          \`--update-repo ${REPO}\`.

          Tag scheme: \`<official tag>-custom-pre.<i>\` is a preview build (replace manually),
          \`<official tag>-custom.<i>\` is a release build (picked up by automatic updates).
          Automatic updates only follow the \`-custom.<i>\` line."

          # 清理不符合当前方案的旧 Release/tag，避免它们被自动通道误选：
          # 只保留 <base>-custom.<i>（正式）与 <base>-custom-pre.<i>（预览），
          # 其余带 -custom 的旧格式（时间戳/额外段）以及早期的 "custom" 固定 tag 全部删除。
          mapfile -t STALE < <(gh release list --repo "${REPO}" --limit 200 \
            --json tagName --jq '.[].tagName' \
            | { grep -E -- '-custom' || true; } \
            | { grep -EvE -- '^[0-9]+\.[0-9]+\.[0-9]+-custom(-pre)?\.[0-9]{1,8}$' || true; })
          for tag in "${STALE[@]:-}"; do
            [ -n "${tag}" ] || continue
            echo "Deleting stale release ${tag}..."
            gh release delete "${tag}" --repo "${REPO}" --cleanup-tag --yes || true
          done

          # 发布正式版时清理所有预览版：预览只供人工使用，正式版发布后即被取代。
          # （自动更新通道本来就不选 -custom-pre.*，这里只是保持列表干净。）
          if [ "${PRERELEASE}" != "true" ]; then
            mapfile -t PREVIEWS < <(gh release list --repo "${REPO}" --limit 200 \
              --json tagName --jq '.[].tagName' \
              | { grep -E -- '-custom-pre\.[0-9]+$' || true; })
            for tag in "${PREVIEWS[@]:-}"; do
              [ -n "${tag}" ] || continue
              echo "Deleting preview release ${tag} (superseded by ${RELTAG})..."
              gh release delete "${tag}" --repo "${REPO}" --cleanup-tag --yes || true
            done
          fi

          # 预览版标 prerelease；正式版不标。
          FLAGS=(--repo "${REPO}" --target "${GITHUB_SHA}" --title "Custom Build (${VERSION})" --notes "${NOTES}" --latest=false)
          if [ "${PRERELEASE}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "${RELTAG}" "${FLAGS[@]}" artifacts/komari-agent-*
