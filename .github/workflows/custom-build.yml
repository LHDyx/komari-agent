name: Custom Cross Build

# 个人 fork 用的交叉编译工作流：覆盖与官方 build_all.sh 完全一致的全部平台组合，
# 产物上传为 Artifact，并发布为预发布 Release。
#
# 版本号约定（见 CUSTOM-BUILD.md）：
#   内嵌版本    = <正式 tag>-0.custom.<yymmddhhMM>    例如 1.5.11-0.custom.2611161100
#   Release tag = <正式 tag>-custom.<yymmddhhMM>      例如 1.5.11-custom.2611161100
# 基础版本与官方同步、不领先；Release tag 按时间递增，内嵌版本严格更低，
# 因此更新器可把后续自构建识别为"更新"（自建仓库下自动允许预发布）：
#   komari-agent --update-repo LHDyx/komari-agent   （默认值已是该仓库，可省略）
# 本工作流不做官方 snapshot 那样的 "必须等于上游 main" 校验，fork 的改动可以直接构建。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '内嵌版本号（留空自动生成 <最近正式tag>-0.custom.<时间>）'
        required: false
        type: string
      publish:
        description: '是否发布 Release（关闭则只上传 Artifact）'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/README.md'
      - '**.md'

permissions:
  contents: write

concurrency:
  group: custom-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      reltag: ${{ steps.version.outputs.reltag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 时间戳 yymmddhhMM（UTC）。Release tag 按它递增，保证每次构建都比上一次大。
          TS="$(date -u +%y%m%d%H%M)"
          SHA="$(git rev-parse --short HEAD)"
          # 只认形如 x.y.z 的正式 tag。不用 git describe --match：其通配符是 fnmatch（无 FNM_PATHNAME），
          # '*' 能跨过 '.'，所以 '0.0.2-custom.2611' 这类 tag 也会被匹配到；这里直接列出并精确过滤。
          CURRENT_LINE="$(git tag --merged HEAD --sort=-v:refname | grep -Ex '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
          if [ -z "${CURRENT_LINE}" ]; then
            echo "WARNING: 未找到形如 x.y.z 的正式 tag，回退到 0.0.0" >&2
            CURRENT_LINE="0.0.0"
          fi
          # 基础版本 = 最近正式 tag（与官方同步，不领先）。
          MAJOR="${CURRENT_LINE%%.*}"
          REST="${CURRENT_LINE#*.}"
          MINOR="${REST%%.*}"
          BASE="${CURRENT_LINE}"

          # 二进制内嵌版本：<基础版本>-0.custom.<时间戳>
          # 带一级预发布 "0"，使内嵌版本严格低于同号正式版和任何 1.5.11-custom.* 自构建 tag，
          # 这样更新器才会把后续自构建当成"更新"（blang/semver 里 alpha+数字 的预发布低于同号正式版）。
          # 面板显示的仍是 1.5.11-0.custom.<时间戳>，一看就知道是自构建。
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${BASE}-0.custom.${TS}"
          fi

          # Release tag：<基础版本>-custom.<时间戳>（如 1.5.11-custom.2611161046）。
          # 与官方 1.5.11 同一基础版本号，不领先；按时间戳递增，
          # 更新器在 allowPrerelease（--update-repo 指向自建仓库时自动开启）下可选中最新一次。
          RELTAG="${BASE}-custom.${TS}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "reltag=${RELTAG}" >> "$GITHUB_OUTPUT"
          echo "Embedded version: ${VERSION}"
          echo "Release tag:      ${RELTAG}"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 build_all.sh / release.yml 保持一致
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          BINARY_NAME="komari-agent-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -trimpath \
            -ldflags="-s -w -X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION}" \
            -o "${BINARY_NAME}"
          sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [prepare, build]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELTAG: ${{ needs.prepare.outputs.reltag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -alR artifacts
          NOTES="Custom build of Komari Agent.

          - Embedded version: \`${VERSION}\`
          - Release tag: \`${RELTAG}\`
          - Source: ${REPO}@${GITHUB_SHA}
          - Actions run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}

          Personal build, not an official Komari Agent release. Assets follow the official naming
          (\`komari-agent-<os>-<arch>\`), so it can be used as an auto-update source via
          \`--update-repo ${REPO}\`."

          # 清理历史遗留的固定 tag 版 Release（早期方案用的 tag "custom"）。
          if gh release view custom --repo "${REPO}" >/dev/null 2>&1; then
            echo "Deleting legacy release 'custom'..."
            gh release delete custom --repo "${REPO}" --cleanup-tag --yes || true
          fi

          # 保留最近若干次自构建 Release，供作为更新源时按 semver 递增选择；其余清理。
          KEEP=10
          mapfile -t OLD < <(gh release list --repo "${REPO}" --limit 100 \
            --json tagName --jq '.[].tagName' | grep -E -- '-custom\.[0-9]{10,}$' | sort -r | tail -n +$((KEEP + 1)) || true)
          for tag in "${OLD[@]:-}"; do
            [ -n "${tag}" ] || continue
            echo "Deleting old custom release ${tag}..."
            gh release delete "${tag}" --repo "${REPO}" --cleanup-tag --yes || true
          done

          # prerelease=true：agent 的稳定通道会跳过预发布，只有在显式指定该版本时才可取用；
          # 版本号仍可正常解析比较（1.5.11-custom.* > 1.5.11）。
          gh release create "${RELTAG}" \
            --repo "${REPO}" \
            --target "${GITHUB_SHA}" \
            --title "Custom Build (${VERSION})" \
            --notes "${NOTES}" \
            --prerelease \
            --latest=false \
            artifacts/komari-agent-*
