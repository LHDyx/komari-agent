name: Offline Installer

# 构建单文件离线安装器：每个 OS/架构一个可执行文件，内嵌对应 agent、
# 安装脚本、version.txt（Windows 另含 nssm 的 sm.exe）。
# 产物发布到版本化标签 "offline-installer-<版本>" 的 Release；
# payload 直接使用该版本已发布的正式版 agent 资产，不从源码重建。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '内嵌 agent 版本。留空则使用 version.txt（当前为最新正式版）'
        required: false
        default: ''
        type: string
      publish:
        description: '是否发布到滚动 offline-installer Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: offline-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="$(tr -d '[:space:]' < version.txt)"
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-custom\.[0-9]{1,8}$'; then
            echo "Offline installers must use a published formal release (<x.y.z>-custom.<i>): ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Embedded agent version: ${VERSION}"

      - name: Remove legacy rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view offline-installer --repo "${REPO}" >/dev/null 2>&1; then
            echo "Deleting legacy rolling release 'offline-installer'..."
            gh release delete offline-installer --repo "${REPO}" --cleanup-tag --yes
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download published agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PAYLOAD=cmd/offline-installer/payload
          mkdir -p "$PAYLOAD"
          NAME="komari-agent-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            NAME="${NAME}.exe"
          fi
          URL="https://github.com/${REPO}/releases/download/${VERSION}/${NAME}"
          echo "Downloading ${URL}"
          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 20 -o "$PAYLOAD/$NAME" "$URL"
          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 20 -o "$PAYLOAD/$NAME.sha256" "${URL}.sha256"
          ( cd "$PAYLOAD" && sha256sum -c "$NAME.sha256" )
          mv "$PAYLOAD/$NAME" "$PAYLOAD/agent"
          cp install.sh install.ps1 version.txt "$PAYLOAD/"

      - name: Fetch nssm for windows builds
        if: matrix.goos == 'windows'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 20 -o /tmp/nssm.zip https://nssm.cc/release/nssm-2.24.zip
          rm -rf /tmp/nssm && mkdir -p /tmp/nssm
          unzip -q -o /tmp/nssm.zip -d /tmp/nssm
          NSSM="$(find /tmp/nssm -path '*win32/nssm.exe' -type f | head -n 1)"
          if [ -z "$NSSM" ]; then
            echo "nssm.exe not found in archive" >&2
            exit 1
          fi
          cp "$NSSM" cmd/offline-installer/payload/sm.exe

      - name: Build installer
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          NAME="komari-agent-installer-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            NAME="${NAME}.exe"
          fi
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -tags offline_payload -trimpath \
            -ldflags="-s -w" -o "$NAME" ./cmd/offline-installer
          sha256sum "$NAME" > "$NAME.sha256"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: offline-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komari-agent-installer-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [prepare, build]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish installer release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="offline-installer-${VERSION}"
          ls -alR artifacts
          NOTES="Offline installers for Komari Agent.

          - Embedded agent version: \`${VERSION}\`
          - Source: ${REPO}@${GITHUB_SHA}
          - Actions run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}

          Each asset is a single executable that installs the agent without
          contacting GitHub. Assets are named \`komari-agent-installer-<os>-<arch>\`.
          The embedded agent is the published \`${VERSION}\` release asset (not rebuilt)."

          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Replacing existing ${TAG} release..."
            gh release delete "${TAG}" --repo "${REPO}" --cleanup-tag --yes
          fi

          gh release create "${TAG}" \
            --repo "${REPO}" \
            --target "${GITHUB_SHA}" \
            --title "Offline Installers (${VERSION})" \
            --notes "${NOTES}" \
            --latest=false \
            artifacts/komari-agent-installer-*
